<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WILKER Planner</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#748096;--line:#e7ebf2;--blue:#2563eb;--blue2:#eef5ff;--green:#0ea875;--red:#dd4343;--orange:#c47a00;--purple:#7650df;--shadow:0 10px 28px rgba(21,34,58,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
aside{width:240px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 26px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{display:block}.brand small{color:#8a94a8;letter-spacing:2px;font-size:9px}nav{display:grid;gap:5px}.nav{border:0;background:none;color:#657188;padding:11px 12px;border-radius:9px;text-align:left;font-weight:650}.nav.active,.nav:hover{background:var(--blue2);color:var(--blue)}.sideBottom{margin-top:auto}.local{border:1px solid var(--line);padding:10px;border-radius:11px;font-size:11px;color:var(--muted);margin-bottom:8px}.sideBtn{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;margin-top:7px;color:#5f6c81}
main{flex:1;min-width:0}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 30px;position:sticky;top:0;z-index:4}.top h1{font-size:23px;margin:0}.date{font-size:11px;color:var(--muted);margin-bottom:3px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 13px;color:#58657b;font-weight:650}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.view{display:none;padding:26px 30px 45px}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:18px}.label{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}.value{font-size:26px;font-weight:800;margin-top:7px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.twocol{display:grid;grid-template-columns:1.35fr .8fr;gap:14px;margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{font-size:15px;margin:0}.muted{font-size:11px;color:var(--muted)}.rows{display:grid;gap:8px}.row{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:grid;grid-template-columns:20px 1fr auto auto;gap:10px;align-items:center}.task{font-size:12px;font-weight:700}.meta{font-size:10px;color:var(--muted);margin-top:3px}.check{width:18px;height:18px;border-radius:5px;border:1px solid #cdd5e2;background:#fff}.check.on{background:var(--green);border-color:var(--green);color:#fff}.pill{font-size:9px;font-weight:750;padding:5px 8px;border-radius:999px}.pill.blue{background:#edf4ff;color:var(--blue)}.pill.green{background:#e9fbf4;color:#078962}.pill.orange{background:#fff5df;color:var(--orange)}.pill.red{background:#ffeded;color:var(--red)}.bar{height:9px;background:#eef2f7;border-radius:20px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,#2563eb,#8b5cf6)}.barrow{display:grid;grid-template-columns:85px 1fr 35px;gap:9px;align-items:center;font-size:11px;margin:13px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.section{font-size:11px;color:#6c7890;text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.day{min-height:130px;padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day:nth-child(7n){border-right:0}.dhead{font-size:10px;color:var(--muted);font-weight:700}.dnum{font-size:14px;font-weight:800;margin:3px 0 8px}.event{font-size:9px;font-weight:700;border-radius:6px;padding:5px 6px;margin:4px 0;background:#edf4ff;color:#2563eb}.event.gym{background:#e9fbf4;color:#078962}.event.work{background:#fff5df;color:#a86d00}.event.fin{background:#ffeded;color:#c73737}.tableHead,.tableRow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;align-items:center;padding:11px 12px}.tableHead{font-size:10px;color:var(--muted);text-transform:uppercase}.tableRow{background:#fff;border:1px solid var(--line);border-radius:9px;margin:5px 0;font-size:11px}.money{font-weight:800}.pos{color:#0a996d}.neg{color:#d23f3f}.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.phase h3{font-size:14px;margin:10px 0 4px}.phase ul{font-size:11px;line-height:1.9;color:#56627a;padding-left:17px}.tag{display:inline-block;font-size:9px;background:#edf4ff;color:var(--blue);padding:4px 6px;border-radius:5px;font-weight:750}
.modal{position:fixed;inset:0;background:rgba(14,23,42,.48);display:grid;place-items:center;z-index:20;padding:18px}.hidden{display:none}.modalBox{width:min(640px,100%);background:#fff;border-radius:14px;padding:22px}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead h2{margin:0;font-size:18px}.x{border:0;background:none;font-size:25px;color:#758096}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.modal label{display:grid;gap:5px;font-size:10px;color:#647086;font-weight:750;margin:10px 0}.modal input,.modal select,.modal textarea{padding:9px;border:1px solid #dce2eb;border-radius:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:11px 14px;border-radius:8px;font-size:11px;opacity:0;transform:translateY(6px);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:950px){aside{width:72px}.brand div:not(.mark),.nav span,.sideBottom{display:none}.nav{text-align:center}.stats{grid-template-columns:repeat(2,1fr)}.twocol,.roadmap{grid-template-columns:1fr 1fr}}
@media(max-width:650px){aside{display:none}.top{padding:0 15px}.view{padding:18px 15px 35px}.stats,.twocol,.roadmap{grid-template-columns:1fr}.calendar{grid-template-columns:1fr}.day{min-height:80px}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="mark">W</div><div><b>WILKER</b><small>PLANNER</small></div></div>
  <nav>
    <button class="nav active" data-view="dashboard">◈ <span>Visão geral</span></button>
    <button class="nav" data-view="tasks">☷ <span>Tarefas</span></button>
    <button class="nav" data-view="schedule">◷ <span>Cronograma</span></button>
    <button class="nav" data-view="finance">R$ <span>Finanças</span></button>
    <button class="nav" data-view="investments">◆ <span>Investimentos</span></button>
    <button class="nav" data-view="roadmap">↗ <span>Trilha TI</span></button>
  </nav>
  <div class="sideBottom">
    <div class="local">● Dados locais<br><small>Nada sai deste PC</small></div>
    <button class="sideBtn" id="exportBtn">↓ Backup</button>
    <label class="sideBtn">↑ Importar<input id="import" type="file" accept=".json" hidden></label>
  </div>
</aside>
<main>
<header class="top"><div><div class="date" id="today"></div><h1 id="title">Visão geral</h1></div><button class="btn primary" onclick="openTask()">＋ Nova tarefa</button></header>
<section id="dashboard" class="view active"></section>
<section id="tasks" class="view"></section>
<section id="schedule" class="view"></section>
<section id="finance" class="view"></section>
<section id="investments" class="view"></section>
<section id="roadmap" class="view"></section>
</main></div>

<div id="taskModal" class="modal hidden"><div class="modalBox"><div class="modalHead"><h2 id="taskModalTitle">Nova tarefa</h2><button class="x" onclick="closeTask()">×</button></div><form id="taskForm">
<label>Tarefa<input id="tTitle" required></label><div class="formgrid">
<label>Área<select id="tArea"><option>Estudos</option><option>Trabalho</option><option>Academia</option><option>Finanças</option><option>Pessoal</option></select></label>
<label>Status<select id="tStatus"><option>A fazer</option><option>Em andamento</option><option>Concluída</option></select></label>
<label>Prioridade<select id="tPriority"><option>Alta</option><option>Média</option><option>Baixa</option></select></label>
<label>Data<input id="tDate" type="date"></label><label>Hora<input id="tTime" type="time"></label><label>Duração<input id="tDuration" type="number" min="15" step="15" value="60"></label></div>
<label>Observações<textarea id="tNotes" rows="3"></textarea></label><div class="actions"><button type="button" class="btn" onclick="closeTask()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>

<div id="finModal" class="modal hidden"><div class="modalBox"><div class="modalHead"><h2>Nova movimentação</h2><button class="x" onclick="closeFin()">×</button></div><form id="finForm">
<label>Descrição<input id="fDesc" required></label><div class="formgrid"><label>Tipo<select id="fType"><option>Receita</option><option>Despesa</option></select></label><label>Categoria<select id="fCat"><option>Salário</option><option>Casa</option><option>Alimentação</option><option>Transporte</option><option>Estudos</option><option>Academia</option><option>Lazer</option><option>Investimentos</option><option>Outros</option></select></label><label>Valor<input id="fValue" type="number" step=".01" min="0" required></label><label>Data<input id="fDate" type="date" required></label></div>
<div class="actions"><button type="button" class="btn" onclick="closeFin()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY="wilker-planner-v1";const iso=()=>new Date().toISOString().slice(0,10);const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(+v||0);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{tasks:[],finances:[],investments:[]};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
if(!state.tasks.length){state.tasks=[
{id:uid(),title:"Trabalho / expediente",area:"Trabalho",status:"A fazer",priority:"Alta",date:iso(),time:"08:00",duration:480,notes:"Bloco principal."},
{id:uid(),title:"Academia",area:"Academia",status:"A fazer",priority:"Média",date:iso(),time:"18:00",duration:60,notes:"Treino."},
{id:uid(),title:"Estudo principal",area:"Estudos",status:"A fazer",priority:"Alta",date:iso(),time:"19:30",duration:120,notes:"Bloco de foco."},
{id:uid(),title:"Revisão financeira",area:"Finanças",status:"A fazer",priority:"Média",date:iso(),time:"21:30",duration:20,notes:"Conferir saldo."}];save()}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const done=t=>t.status==="Concluída";const qs=s=>document.querySelector(s);const qsa=s=>[...document.querySelectorAll(s)];
function toast(m){const t=qs("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
function render(){
 qs("#today").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
 renderDash();renderTasks();renderSchedule();renderFinance();renderInvestments();renderRoadmap();
}
function renderDash(){
 const d=state.tasks.filter(done).length,t=state.tasks.length,inc=state.finances.filter(x=>x.type==="Receita").reduce((a,x)=>a+x.value,0),exp=state.finances.filter(x=>x.type==="Despesa").reduce((a,x)=>a+x.value,0),inv=state.investments.reduce((a,x)=>a+x.value,0);
 qs("#dashboard").innerHTML=`<div class="stats">
 <div class="card"><div class="label">Tarefas concluídas</div><div class="value">${d}/${t}</div><div class="sub">${t?Math.round(d/t*100):0}% do planejado</div></div>
 <div class="card"><div class="label">Saldo</div><div class="value">${money(inc-exp)}</div><div class="sub">receitas − despesas</div></div>
 <div class="card"><div class="label">Investimentos</div><div class="value">${money(inv)}</div><div class="sub">valor informado</div></div>
 <div class="card"><div class="label">Meta de estudo</div><div class="value">2h/dia</div><div class="sub">foco inicial</div></div></div>
 <div class="twocol"><div class="card"><div class="head"><h2>Hoje</h2><button class="btn" onclick="openTask()">＋</button></div>${todayRows()}</div>
 <div class="card"><div class="head"><h2>Distribuição</h2></div>${bars()}</div></div>`;
}
function todayRows(){const a=state.tasks.filter(x=>x.date===iso()).sort((a,b)=>(a.time||"").localeCompare(b.time||""));if(!a.length)return '<div class="muted">Nenhuma tarefa.</div>';return '<div class="rows">'+a.map(taskRow).join("")+"</div>"}
function taskRow(x){return `<div class="row"><button class="check ${done(x)?"on":""}" onclick="toggle('${x.id}')">${done(x)?"✓":""}</button><div><div class="task">${esc(x.title)}</div><div class="meta">${x.time||"--"} · ${x.duration||0} min · ${x.area}</div></div><span class="pill ${x.priority==="Alta"?"red":x.priority==="Média"?"orange":"blue"}">${x.priority}</span><button class="btn" onclick="editTask('${x.id}')">✎</button></div>`}
function bars(){const o={Estudos:0,Trabalho:0,Academia:0,Finanças:0,Pessoal:0};state.tasks.forEach(x=>o[x.area]=(o[x.area]||0)+1);const m=Math.max(1,...Object.values(o));return Object.entries(o).map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="bar"><i style="width:${v/m*100}%"></i></div><b>${v}</b></div>`).join("")}
function renderTasks(){qs("#tasks").innerHTML=`<div class="toolbar"><button class="btn primary" onclick="openTask()">＋ Nova tarefa</button><button class="btn" onclick="filterTasks('all')">Todas</button><button class="btn" onclick="filterTasks('open')">Abertas</button><button class="btn" onclick="filterTasks('done')">Concluídas</button></div><div class="card"><div class="head"><h2>Tarefas</h2><span class="muted">${state.tasks.length} registros</span></div><div class="rows">${state.tasks.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.time||"").localeCompare(b.time||"")).map(taskRow).join("")}</div></div>`}
function filterTasks(m){qsa("#tasks .row").forEach(r=>{const c=r.querySelector(".check").classList.contains("on");r.style.display=m==="all"?"grid":m==="done"?(c?"grid":"none"):(c?"none":"grid")})}
function toggle(id){const x=state.tasks.find(x=>x.id===id);if(x){x.status=done(x)?"A fazer":"Concluída";save();render()}}
function deleteTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save();render();toast("Tarefa excluída.")}
function openTask(id){const x=state.tasks.find(x=>x.id===id)||{id:"",title:"",area:"Estudos",status:"A fazer",priority:"Média",date:iso(),time:"19:30",duration:60,notes:""};qs("#taskModalTitle").textContent=id?"Editar tarefa":"Nova tarefa";qs("#tTitle").value=x.title;qs("#tArea").value=x.area;qs("#tStatus").value=x.status;qs("#tPriority").value=x.priority;qs("#tDate").value=x.date;qs("#tTime").value=x.time;qs("#tDuration").value=x.duration;qs("#tNotes").value=x.notes;qs("#taskForm").dataset.id=x.id;qs("#taskModal").classList.remove("hidden")}
function editTask(id){openTask(id)}function closeTask(){qs("#taskModal").classList.add("hidden")}
qs("#taskForm").onsubmit=e=>{e.preventDefault();const id=e.target.dataset.id||uid(),x={id,title:qs("#tTitle").value,area:qs("#tArea").value,status:qs("#tStatus").value,priority:qs("#tPriority").value,date:qs("#tDate").value,time:qs("#tTime").value,duration:+qs("#tDuration").value,notes:qs("#tNotes").value};const old=state.tasks.findIndex(y=>y.id===id);if(old>=0)state.tasks[old]=x;else state.tasks.push(x);save();closeTask();render();toast("Tarefa salva.")}
function renderSchedule(){const s=new Date();s.setDate(s.getDate()-s.getDay());let h='<div class="card"><div class="head"><div><h2>Semana</h2><div class="muted">Trabalho + academia + 2h de estudo</div></div><button class="btn primary" onclick="applyRoutine()">Aplicar rotina</button></div><div class="calendar">';const days=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);const id=d.toISOString().slice(0,10);h+=`<div class="day"><div class="dhead">${days[d.getDay()]}</div><div class="dnum">${d.getDate()}</div>${state.tasks.filter(x=>x.date===id).sort((a,b)=>(a.time||"").localeCompare(b.time||"")).map(x=>`<div class="event ${x.area==="Academia"?"gym":x.area==="Trabalho"?"work":x.area==="Finanças"?"fin":""}">${x.time||""} ${esc(x.title)}</div>`).join("")}</div>`}h+="</div></div>";qs("#schedule").innerHTML=h}
function applyRoutine(){const base=new Date();base.setDate(base.getDate()-base.getDay());for(let i=1;i<=5;i++){const d=new Date(base);d.setDate(base.getDate()+i);const id=d.toISOString().slice(0,10);if(!state.tasks.some(x=>x.date===id&&x.title==="Estudo principal"))state.tasks.push({id:uid(),title:"Estudo principal",area:"Estudos",status:"A fazer",priority:"Alta",date:id,time:"19:30",duration:120,notes:"Bloco de foco."});if([1,3,5].includes(d.getDay())&&!state.tasks.some(x=>x.date===id&&x.title==="Academia"))state.tasks.push({id:uid(),title:"Academia",area:"Academia",status:"A fazer",priority:"Média",date:id,time:"18:00",duration:60,notes:"Treino."})}save();render();toast("Rotina semanal aplicada.")}
function renderFinance(){const inc=state.finances.filter(x=>x.type==="Receita").reduce((a,x)=>a+x.value,0),exp=state.finances.filter(x=>x.type==="Despesa").reduce((a,x)=>a+x.value,0);qs("#finance").innerHTML=`<div class="stats"><div class="card"><div class="label">Receitas</div><div class="value pos">${money(inc)}</div></div><div class="card"><div class="label">Despesas</div><div class="value neg">${money(exp)}</div></div><div class="card"><div class="label">Saldo</div><div class="value">${money(inc-exp)}</div></div><div class="card"><div class="label">Poupança</div><div class="value">${inc?Math.round((inc-exp)/inc*100):0}%</div></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="openFin()">＋ Nova movimentação</button></div><div class="card"><div class="head"><h2>Movimentações</h2></div>${state.finances.length?'<div class="tableHead"><div>Descrição</div><div>Categoria</div><div>Data</div><div>Tipo</div><div>Valor</div></div>'+state.finances.map(x=>`<div class="tableRow"><div><b>${esc(x.desc)}</b></div><div>${x.category}</div><div>${x.date}</div><div><span class="pill ${x.type==="Receita"?"green":"red"}">${x.type}</span></div><div class="money ${x.type==="Receita"?"pos":"neg"}">${x.type==="Receita"?"+":"−"} ${money(x.value)}</div></div>`).join(""):'<div class="muted">Nenhuma movimentação cadastrada.</div>'}</div>`}
function openFin(){qs("#fDate").value=iso();qs("#finModal").classList.remove("hidden")}function closeFin(){qs("#finModal").classList.add("hidden")}
qs("#finForm").onsubmit=e=>{e.preventDefault();state.finances.push({id:uid(),desc:qs("#fDesc").value,type:qs("#fType").value,category:qs("#fCat").value,value:+qs("#fValue").value,date:qs("#fDate").value});save();e.target.reset();closeFin();render();toast("Movimentação salva.")}
function renderInvestments(){const total=state.investments.reduce((a,x)=>a+x.value,0);qs("#investments").innerHTML=`<div class="stats"><div class="card"><div class="label">Patrimônio</div><div class="value">${money(total)}</div><div class="sub">registro manual</div></div><div class="card"><div class="label">Ativos</div><div class="value">${state.investments.length}</div></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="addInv()">＋ Adicionar ativo</button></div><div class="card"><div class="head"><h2>Carteira</h2><span class="muted">sem conexão com corretora</span></div>${state.investments.length?'<div class="tableHead"><div>Ativo</div><div>Tipo</div><div>Valor</div><div>Rentabilidade</div><div></div></div>'+state.investments.map((x,i)=>`<div class="tableRow"><div><b>${esc(x.name)}</b></div><div>${esc(x.type)}</div><div class="money">${money(x.value)}</div><div class="${x.return>=0?"pos":"neg"}">${x.return||0}%</div><div><button class="btn" onclick="delInv(${i})">×</button></div></div>`).join(""):'<div class="muted">Cadastre seus ativos para acompanhar patrimônio.</div>'}</div>`}
function addInv(){const name=prompt("Nome do ativo:");if(!name)return;const type=prompt("Tipo do ativo:","Renda fixa");const value=+(prompt("Valor atual:","0")||0),ret=+(prompt("Rentabilidade %:","0")||0);state.investments.push({name,type:type||"Outro",value,return:ret});save();render();toast("Ativo adicionado.")}function delInv(i){state.investments.splice(i,1);save();render()}
function renderRoadmap(){const p=[["01","Fundamentos + Software",["Lógica","JavaScript + TypeScript","Python","Git + GitHub","SQL + PostgreSQL"]],["02","Backend + APIs",["Node.js / FastAPI","REST + autenticação","Docker","Testes","Projeto real"]],["03","Cloud + DevOps",["Linux","AWS ou Azure","CI/CD","Terraform","Monitoramento"]],["04","IA + Segurança",["LLM APIs","RAG e agentes","App Security","Cloud Security","Projeto final"]]];qs("#roadmap").innerHTML='<div class="twocol" style="margin-top:0"><div class="card"><div class="head"><div><h2>Trilha TI</h2><div class="muted">Software → Cloud → IA → Segurança</div></div><span class="pill blue">12 meses</span></div><div class="bar"><i style="width:8%"></i></div><div class="muted" style="margin-top:8px">Base recomendada para estudar junto com trabalho e faculdade.</div></div><div class="card"><div class="head"><h2>Rotina</h2></div><div class="muted" style="line-height:2">08:00–17:00 trabalho<br>18:00–19:00 academia (3x)<br>19:30–21:30 estudo<br>21:30–21:50 organização</div></div></div><div class="roadmap" style="margin-top:14px">'+p.map(x=>`<div class="card phase"><span class="pill blue">${x[0]}</span><h3>${x[1]}</h3><ul>${x[2].map(y=>`<li>${y}</li>`).join("")}</ul><span class="tag">foco</span></div>`).join("")+'</div>'}
qsa(".nav").forEach(b=>b.onclick=()=>{qsa(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");qsa(".view").forEach(x=>x.classList.remove("active"));qs("#"+b.dataset.view).classList.add("active");const m={dashboard:"Visão geral",tasks:"Tarefas",schedule:"Cronograma",finance:"Finanças",investments:"Investimentos",roadmap:"Trilha TI"};qs("#title").textContent=m[b.dataset.view]});
qs("#exportBtn").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="wilker-planner-backup.json";a.click();toast("Backup exportado.")};
qs("#import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast("Backup importado.")}catch{toast("Backup inválido.")}};r.readAsText(f)};
render();
</script>
</body></html>
