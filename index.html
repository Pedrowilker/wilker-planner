<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#748096;--line:#e4e9f1;--blue:#2767ee;--blue2:#edf4ff;--green:#0a9b72;--green2:#e9f9f3;--orange:#c98200;--orange2:#fff5df;--red:#d64545;--red2:#ffeded;--purple:#7851dc;--purple2:#f1ecff;--shadow:0 10px 28px rgba(20,35,60,.06)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}.sidebar{width:250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:3px 8px 24px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2465ed,#8759e6);display:grid;place-items:center;color:#fff;font-weight:900}.brand b{font-size:15px}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#8a95a7;margin-top:3px}.nav{border:0;background:transparent;width:100%;text-align:left;padding:11px 12px;border-radius:9px;color:#66728a;font-weight:700;margin:3px 0}.nav:hover,.nav.active{background:var(--blue2);color:var(--blue)}.sideBottom{margin-top:auto}.local{border:1px solid var(--line);border-radius:10px;padding:10px;color:#657186;font-size:11px;line-height:1.55}.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--green);margin-right:5px}.sideBtn{width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#5d6a80;font-weight:700}.sideBtn input{display:none}
.main{min-width:0;flex:1}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);padding:0 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:3px}.topbar h1{font-size:22px;margin:0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:#5d6b80;padding:9px 12px;border-radius:8px;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.small{padding:5px 8px;font-size:10px}.btn.danger{color:var(--red)}
.view{display:none;padding:26px 30px 55px}.view.active{display:block}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.25fr .9fr}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.head h2{font-size:15px;margin:0}.muted{font-size:11px;color:var(--muted)}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.big{font-size:27px;font-weight:850;margin-top:7px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.pos{color:var(--green)}.neg{color:var(--red)}
.rows{display:grid;gap:8px}.taskRow{border:1px solid var(--line);padding:11px;border-radius:9px;display:grid;grid-template-columns:20px 1fr auto auto;gap:8px;align-items:center}.taskName{font-size:12px;font-weight:800}.meta{font-size:10px;color:var(--muted);margin-top:3px}.check{width:18px;height:18px;border:1px solid #cbd4e1;border-radius:5px;background:#fff;color:#fff}.check.done{background:var(--green);border-color:var(--green)}
.pill{display:inline-flex;align-items:center;padding:4px 7px;border-radius:99px;font-size:9px;font-weight:850}.blue{background:var(--blue2);color:var(--blue)}.green{background:var(--green2);color:var(--green)}.orange{background:var(--orange2);color:var(--orange)}.redP{background:var(--red2);color:var(--red)}.purple{background:var(--purple2);color:var(--purple)}
.bars{display:grid;gap:11px}.barRow{display:grid;grid-template-columns:88px 1fr auto;gap:9px;align-items:center;font-size:10px}.bar{height:9px;border-radius:99px;background:#eef2f7;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2868ee,#7d57df)}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.lane{background:#edf1f6;border-radius:12px;padding:10px;min-height:440px}.lane.drop{outline:2px dashed #9ab5f7}.laneTitle{display:flex;justify-content:space-between;font-size:11px;font-weight:850;color:#5f6b7e;padding:3px 4px 9px}.kcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;margin:7px 0;box-shadow:0 4px 14px rgba(20,35,60,.04)}.kTitle{font-size:12px;font-weight:800}.kMeta{font-size:10px;color:var(--muted);margin-top:5px}.kActions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:9px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.day{min-height:140px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day:nth-child(7n){border-right:0}.dhead{font-size:10px;color:var(--muted);font-weight:800}.dnum{font-size:14px;font-weight:850;margin:4px 0 8px}.event{font-size:9px;font-weight:750;padding:5px 6px;border-radius:6px;background:var(--blue2);color:var(--blue);margin:4px 0}.event.gym{background:var(--green2);color:var(--green)}.event.work{background:var(--orange2);color:var(--orange)}.event.fin{background:var(--red2);color:var(--red)}.event.study{background:var(--purple2);color:var(--purple)}
.tableHead,.tableRow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;align-items:center}.tableHead{font-size:9px;text-transform:uppercase;color:var(--muted);padding:8px 10px}.tableRow{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:11px;margin:5px 0}
.monthBars{display:flex;align-items:end;gap:10px;height:170px}.mbar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:5px}.mbar i{display:block;width:80%;max-width:32px;background:linear-gradient(180deg,#7e57e1,#2868ee);border-radius:7px 7px 2px 2px}.mbar span{font-size:9px;color:var(--muted)}
.goalItem{padding:10px 0;border-bottom:1px solid var(--line)}.goalTop{display:flex;justify-content:space-between;gap:8px;font-size:11px}.goalPct{font-size:10px;color:var(--muted);margin-top:4px}.phaseGrid{grid-template-columns:repeat(4,1fr)}.phase h3{font-size:14px;margin:10px 0 5px}.phase ul{font-size:11px;color:#58647a;line-height:1.9;padding-left:17px}
.modal{position:fixed;inset:0;background:rgba(15,24,43,.5);z-index:50;display:grid;place-items:center;padding:18px}.hidden{display:none}.modalBox{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.22)}.modalHead{display:flex;align-items:center;justify-content:space-between}.modalHead h2{margin:0;font-size:18px}.close{border:0;background:transparent;font-size:26px;color:#758196}.formGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.modal label{display:grid;gap:5px;margin:10px 0;font-size:10px;color:#657186;font-weight:800}.modal input,.modal select,.modal textarea{border:1px solid #dbe2ec;border-radius:8px;padding:9px;outline:none;background:#fff}.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#79a3fa;box-shadow:0 0 0 3px #edf4ff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:11px 14px;border-radius:9px;font-size:11px;opacity:0;transform:translateY(8px);transition:.2s;z-index:100}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.sidebar{width:76px}.brand>div:last-child,.nav span,.sideBottom{display:none}.nav{text-align:center}.stats{grid-template-columns:repeat(2,1fr)}.two,.phaseGrid{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{display:none}.topbar{padding:0 16px}.view{padding:18px 15px 40px}.stats,.two,.phaseGrid{grid-template-columns:1fr}.calendar{grid-template-columns:1fr}.day{min-height:85px}.formGrid{grid-template-columns:1fr}.tableHead,.tableRow{grid-template-columns:1.8fr 1fr 1fr}.tableHead div:nth-child(n+4),.tableRow>div:nth-child(n+4){display:none}}

/* ===== WILKER UI POLISH V4 ===== */
html{scroll-behavior:smooth}
body{background:
 radial-gradient(circle at 15% 0%,rgba(39,103,238,.07),transparent 28%),
 radial-gradient(circle at 88% 10%,rgba(120,81,220,.07),transparent 25%),
 var(--bg)}
button{transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease,color .16s ease}
button:active{transform:translateY(1px) scale(.985)}
.btn{position:relative;overflow:hidden;box-shadow:0 1px 1px rgba(20,35,60,.02)}
.btn:hover{border-color:#cbd5e4;color:#26344d;box-shadow:0 8px 20px rgba(25,45,80,.08);transform:translateY(-1px)}
.btn.primary{box-shadow:0 7px 18px rgba(39,103,238,.22)}
.btn.primary:hover{box-shadow:0 10px 24px rgba(39,103,238,.30);filter:brightness(1.02)}
.btn.danger:hover{background:var(--red2);border-color:#ffd0d0}
.nav{position:relative;transition:background .18s ease,color .18s ease,transform .18s ease;padding-left:14px}
.nav:hover{transform:translateX(2px)}
.nav.active{box-shadow:inset 0 0 0 1px rgba(39,103,238,.08),0 6px 16px rgba(39,103,238,.06)}
.nav.active:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:99px;background:linear-gradient(180deg,#2767ee,#8157dd)}
.brand .logo{box-shadow:0 10px 24px rgba(39,103,238,.20);transition:transform .2s ease,box-shadow .2s ease}
.brand:hover .logo{transform:rotate(-3deg) translateY(-1px);box-shadow:0 13px 28px rgba(39,103,238,.28)}
.topbar{backdrop-filter:blur(12px);background:rgba(255,255,255,.88)}
.topbar h1{letter-spacing:-.02em}
.card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(20,35,60,.09);border-color:#dfe5ee}
.stats .card:hover{transform:translateY(-3px)}
.big{letter-spacing:-.03em}
.taskRow{transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}
.taskRow:hover{background:#fcfdff;border-color:#d7dfeb;transform:translateX(2px);box-shadow:0 7px 18px rgba(20,35,60,.05)}
.check{transition:all .16s ease}
.check:hover{border-color:#99b6f7;box-shadow:0 0 0 3px rgba(39,103,238,.08)}
.kanban .lane{transition:background .18s ease,box-shadow .18s ease,transform .18s ease}
.kanban .lane:hover{background:#eef3f8}
.kcard{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,opacity .16s ease}
.kcard:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(20,35,60,.09);border-color:#d6dfec}
.kcard.dragging{opacity:.55;transform:rotate(1deg) scale(.99)}
.lane.drop{background:#e8f0ff;box-shadow:inset 0 0 0 2px rgba(39,103,238,.18)}
.event{transition:transform .14s ease,filter .14s ease,box-shadow .14s ease}
.event:hover{transform:translateY(-1px);filter:brightness(.99);box-shadow:0 5px 12px rgba(20,35,60,.07)}
.pill{transition:transform .14s ease}
.pill:hover{transform:translateY(-1px)}
.bar i{transition:width .65s cubic-bezier(.22,1,.36,1)}
.goalItem{transition:background .16s ease,padding .16s ease;border-radius:8px}
.goalItem:hover{background:#fafcff;padding-left:8px;padding-right:8px}
.tableRow{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.tableRow:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,35,60,.05);border-color:#d8e0eb}
.modal{backdrop-filter:blur(6px)}
.modalBox{animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.view.active{animation:viewIn .22s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
input,select,textarea{transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
input:hover,select:hover,textarea:hover{border-color:#cfd8e4}
input::placeholder,textarea::placeholder{color:#a4afbf}
.sideBtn{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;background:linear-gradient(180deg,#fff,#fbfcfe)}
.sideBtn:hover{transform:translateY(-1px);box-shadow:0 7px 17px rgba(20,35,60,.06);border-color:#d6deea}
.local{background:linear-gradient(180deg,#fbfdff,#f7f9fc)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ccd5e2;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#b8c4d5;border:2px solid transparent;background-clip:padding-box}
@media(max-width:700px){.topbar{backdrop-filter:none}.card:hover{transform:none}.taskRow:hover,.tableRow:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* ===== WILKER FINAL POLISH V5 ===== */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{font-size:13px;letter-spacing:.002em}
.app{width:100%;min-width:0}.sidebar{flex:0 0 250px;width:250px;height:100vh;min-height:0;position:sticky;top:0;overflow:auto;scrollbar-width:thin}.main{width:0;max-width:calc(100vw - 250px);min-width:0;overflow:hidden}.view{width:100%;max-width:100%;overflow:hidden}.grid{min-width:0}.grid>*{min-width:0}
.topbar{min-width:0}.topbar>div:first-child{min-width:0}.topbar h1,.pageHint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{min-width:0}
.stats{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.two{grid-template-columns:minmax(0,1.45fr) minmax(300px,.85fr)}
.card{padding:20px;border-radius:16px}
.stats .card{min-height:122px;display:flex;flex-direction:column;justify-content:center}
.stats .label{font-size:9px;font-weight:800;letter-spacing:1.2px}.big{font-size:30px;line-height:1.05}.sub{font-size:11px}
.nav{font-size:13px;min-height:42px;display:flex;align-items:center;gap:9px}
.nav .navIcon{width:18px;height:18px;display:grid;place-items:center;flex:0 0 18px;color:currentColor}
.nav .navIcon svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav.active .navIcon{color:var(--blue)}
.brand{padding-bottom:22px}.brand .logo{width:40px;height:40px}
.local{padding:9px 10px}.localTitle{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:800}.local small{color:var(--muted)}
.sideActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.sideBtn{margin-top:0;padding:8px 7px;font-size:10px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.sideBtn span{font-size:14px;line-height:1}
.sideBtn input{display:none}
.sectionTop{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
.sectionTitle{font-size:18px;font-weight:850;letter-spacing:-.02em}
.sectionHint{font-size:11px;color:var(--muted);margin-top:3px}
.quickStat{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fbfcff;color:#617088;font-size:10px;font-weight:750}
.quickDot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green2)}
.taskRow{grid-template-columns:24px 1fr auto 34px;padding:12px 13px}.taskRow .taskName{font-size:13px}.taskRow .meta{font-size:10px}
.check{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:900}
.check.done{box-shadow:0 0 0 4px var(--green2)}
.kcard{padding:13px}.kTitle{font-size:13px}.kMeta{font-size:10px}.kActions{margin-top:10px}
.kanban{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.lane{min-width:0}
.calendar{grid-template-columns:repeat(7,minmax(0,1fr))}
.formGrid{min-width:0}.modalBox{width:min(720px,100%);border:1px solid rgba(228,233,241,.9)}
.modal label{font-size:10px}.modal input,.modal select,.modal textarea{font-size:13px}
.tableRow,.tableHead{min-width:0}.tableRow>div{min-width:0;overflow:hidden;text-overflow:ellipsis}
.view.active{animation:viewIn .2s ease}
.emptyState{display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted)}
.emptyState strong{color:var(--text);font-size:13px;margin-bottom:4px}
@media(max-width:1100px){.sidebar{flex-basis:78px;width:78px}.main{max-width:calc(100vw - 78px)}.brand>div:last-child,.nav span,.sideBottom{display:none}.nav{justify-content:center}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{display:none}.main{max-width:100vw;width:100%}.stats{grid-template-columns:1fr}.two{grid-template-columns:1fr}.topbar{padding:0 16px}.topbar .toolbar{gap:5px}.topbar .btn{padding:8px}.topbar .quickStat{display:none}.view{padding:18px 15px 36px}.card{padding:16px}.calendar{grid-template-columns:1fr}.day{min-height:80px}}

.confirmBox{width:min(430px,100%);padding:24px 24px 20px}
.confirmIcon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--red2);color:var(--red);font-weight:900;font-size:18px;margin-bottom:14px;box-shadow:0 8px 20px rgba(214,69,69,.12)}

<label>Tipo<select id="finType"><option>Receita</option><option>Despesa</option></select></label><label>Categoria<select id="finCat"><option>Salário</option><option>Casa</option><option>Alimentação</option><option>Transporte</option><option>Estudos</option><option>Academia</option><option>Lazer</option><option>Investimentos</option><option>Outros</option></select></label><label>Valor<input id="finValue" required type="number" min="0" step="0.01"></label>
<label>Data<input id="finDate" required type="date"></label></div><div class="actions"><button type="button" class="btn" data-close="finModal">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>

  <div class="confirmIcon">!</div>
  <div class="modalHead"><h2 id="confirmTitle">Confirmar ação</h2><button class="close" data-close="confirmModal">×</button></div>
  <p id="confirmMessage" class="muted confirmMessage">Tem certeza?</p>
  <div class="actions"><button type="button" class="btn" data-close="confirmModal">Cancelar</button><button type="button" class="btn primary" id="confirmOk">Excluir registro</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script>
const APP_KEY='wilker-planner-state-v3';
const DEFAULTS={tasks:[],finances:[],investments:[],budgets:{},goals:[],bills:[],studySessions:[],settings:{studyHours:2}};
let state=JSON.parse(JSON.stringify(DEFAULTS));
let apiReady=false;
const hostedMode=location.hostname.endsWith('.github.io');
const q=s=>document.querySelector(s);
const qa=s=>Array.from(document.querySelectorAll(s));
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]});
const isDone=t=>t.status==='Concluída';

function toast(msg){const e=q('#toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function normalize(raw){const x=raw&&typeof raw==='object'?raw:{};
 const clean=function(v){return Array.isArray(v)?v.filter(function(item){return item&&typeof item==='object'}):[]};
 return {
 tasks:clean(x.tasks),finances:clean(x.finances),investments:clean(x.investments),
 budgets:x.budgets&&typeof x.budgets==='object'?x.budgets:{},goals:clean(x.goals),bills:clean(x.bills),studySessions:clean(x.studySessions),
 settings:{...DEFAULTS.settings,...(x.settings||{})}
}}
function localSave(){localStorage.setItem(APP_KEY,JSON.stringify(state))}
async function save(){localSave();if(!apiReady)return;try{await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)})}catch{apiReady=false;toast('Servidor indisponível; backup local mantido.')}}
function seed(){const d=today();state.tasks=[
{id:uid(),title:'Trabalho / expediente',area:'Trabalho',status:'A fazer',priority:'Alta',date:d,time:'08:00',duration:480,notes:''},
{id:uid(),title:'Academia',area:'Academia',status:'A fazer',priority:'Média',date:d,time:'18:00',duration:60,notes:''},
{id:uid(),title:'Estudo principal',area:'Estudos',status:'A fazer',priority:'Alta',date:d,time:'19:30',duration:120,notes:''},
{id:uid(),title:'Revisão financeira',area:'Finanças',status:'A fazer',priority:'Média',date:d,time:'21:30',duration:20,notes:''}];state.finances=[];state.investments=[];localSave()}
async function load(){
 if(hostedMode){
  const raw=localStorage.getItem(APP_KEY);
  state=raw?normalize(JSON.parse(raw)):normalize(DEFAULTS);
  apiReady=false;
  if(!state.tasks.length)seed();
  renderAll();
  return;
 }
 try{
  const r=await fetch('/api/state',{cache:'no-store'});
  if(!r.ok)throw new Error();
  state=normalize(await r.json());apiReady=true;localSave();
 }catch{
  const raw=localStorage.getItem(APP_KEY);
  state=raw?normalize(JSON.parse(raw)):normalize(DEFAULTS);
  apiReady=false;
 }
 if(!state.tasks.length)seed();
 renderAll();
}
function stats(){const income=state.finances.filter(x=>x.type==='Receita').reduce((a,x)=>a+Number(x.value),0),expense=state.finances.filter(x=>x.type==='Despesa').reduce((a,x)=>a+Number(x.value),0),invested=state.investments.reduce((a,x)=>a+Number(x.value),0),hours=state.studySessions.reduce((a,x)=>a+Number(x.hours),0);return{income,expense,balance:income-expense,invested,hours}}
function openModal(id){q('#'+id).classList.remove('hidden')}
function closeModal(id){q('#'+id).classList.add('hidden')}

function renderDashboard(){
 const s=stats(),total=state.tasks.length,finished=state.tasks.filter(isDone).length;
 const todayTasks=state.tasks.filter(x=>x.date===today()).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 const counts={Estudos:0,Trabalho:0,Academia:0,Finanças:0,Pessoal:0};state.tasks.forEach(x=>counts[x.area]=(counts[x.area]||0)+1);const max=Math.max(1,...Object.values(counts));
 let rows='';todayTasks.slice(0,8).forEach(t=>{rows+='<div class="taskRow"><button class="check '+(isDone(t)?'done':'')+'" data-id="'+t.id+'" onclick="toggleTask(this.dataset.id)">'+(isDone(t)?'✓':'')+'</button><div><div class="taskName">'+esc(t.title)+'</div><div class="meta">'+(t.time||'--')+' · '+(t.duration||0)+' min · '+esc(t.area)+'</div></div><span class="pill '+(t.priority==='Alta'?'redP':t.priority==='Média'?'orange':'blue')+'">'+t.priority+'</span><button class="btn small" data-id="'+t.id+'" onclick="editTask(this.dataset.id)">✎</button></div>'});
 let bars='';Object.entries(counts).forEach(function(p){bars+='<div class="barRow"><span>'+p[0]+'</span><div class="bar"><i style="width:'+(p[1]/max*100)+'%"></i></div><b>'+p[1]+'</b></div>'});
 q('#dashboard').innerHTML='<div class="grid stats"><div class="card"><div class="label">Tarefas concluídas</div><div class="big">'+finished+'/'+total+'</div><div class="sub">'+(total?Math.round(finished/total*100):0)+'% do planejado</div></div><div class="card"><div class="label">Saldo</div><div class="big">'+money(s.balance)+'</div><div class="sub">receitas − despesas</div></div><div class="card"><div class="label">Investimentos</div><div class="big">'+money(s.invested)+'</div><div class="sub">controle manual</div></div><div class="card"><div class="label">Estudo registrado</div><div class="big">'+s.hours.toFixed(1)+'h</div><div class="sub">'+state.studySessions.length+' registro(s)</div></div></div>'+
 '<div class="grid two" style="margin-top:14px"><div class="card"><div class="head"><div><h2>Hoje</h2><span class="muted">'+todayTasks.length+' compromisso(s)</span></div><button class="btn small" onclick="openTask()">＋</button></div><div class="rows">'+(rows||'<div class="muted">Nenhuma tarefa para hoje.</div>')+'</div></div>'+
 '<div class="card"><div class="head"><h2>Distribuição</h2></div><div class="bars">'+bars+'</div></div></div>'+
 '<div class="grid two" style="margin-top:14px"><div class="card"><div class="head"><div><h2>Rotina base</h2><span class="muted">equilíbrio entre trabalho, estudo e saúde</span></div></div><div class="muted" style="line-height:2.1">08:00–17:00 trabalho<br>18:00–19:00 academia em 3 dias<br>19:30–21:30 estudo principal<br>Domingo: revisão financeira<br>Manter uma noite livre.</div></div><div class="card"><div class="head"><h2>Meta rápida</h2><span class="pill purple">foco</span></div><div class="muted" style="line-height:2.1">5 blocos de estudo<br>3 treinos<br>1 revisão financeira<br>Registrar gastos no mesmo dia.</div></div></div>'
}
function taskCard(t){return '<div class="kcard" draggable="true" ondragstart="dragTask(event,this.dataset.id)" data-id="'+t.id+'"><div class="kTitle">'+esc(t.title)+'</div><div class="kMeta">'+(t.date||'sem data')+' · '+(t.time||'--')+' · '+esc(t.area)+(t.repeat&&t.repeat!=='none'?' · ↻':'')+'</div><div class="kActions"><span class="pill '+(t.priority==='Alta'?'redP':t.priority==='Média'?'orange':'blue')+'">'+t.priority+'</span><button class="btn small" data-id="'+t.id+'" onclick="editTask(this.dataset.id)">Editar</button><button class="btn small danger" data-id="'+t.id+'" onclick="removeTask(this.dataset.id)">Excluir</button><button class="btn small mobileMove" data-id="'+t.id+'" onclick="advanceTask(this.dataset.id)">Mover</button></div></div>'}
function renderTasks(){
 const groups={'A fazer':state.tasks.filter(x=>x.status==='A fazer'),'Em andamento':state.tasks.filter(x=>x.status==='Em andamento'),'Concluída':state.tasks.filter(isDone)};
 let lanes='';Object.entries(groups).forEach(function(p){let cards='';p[1].forEach(t=>cards+=taskCard(t));lanes+='<div class="lane" data-status="'+p[0]+'" ondragover="allowDrop(event)" ondrop="dropTask(event,this.dataset.status)"><div class="laneTitle"><span>'+p[0]+'</span><span>'+p[1].length+'</span></div>'+(cards||'<div class="muted" style="padding:8px">Nenhuma tarefa.</div>')+'</div>'});
 q('#tasks').innerHTML='<div class="toolbar"><button class="btn primary" onclick="openTask()">＋ Nova tarefa</button><button class="btn" onclick="applyRoutine()">Aplicar rotina da semana</button><span class="muted">Arraste os cartões entre colunas.</span></div><div class="kanban">'+lanes+'</div>'
}
function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('drop')}
function dragTask(e,id){e.dataTransfer.setData('text/plain',id);if(e.currentTarget)e.currentTarget.classList.add('dragging')}
function dropTask(e,status){e.preventDefault();e.currentTarget.classList.remove('drop');qa('.lane').forEach(function(l){l.classList.remove('drop')});qa('.kcard.dragging').forEach(function(k){k.classList.remove('dragging')});const id=e.dataTransfer.getData('text/plain'),t=state.tasks.find(x=>x.id===id);if(!t)return;t.status=status;save().then(renderAll)}
async function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.status=isDone(t)?'A fazer':'Concluída';await save();renderAll()}
async function advanceTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;const flow=['A fazer','Em andamento','Concluída'];const i=flow.indexOf(t.status);t.status=flow[(i+1)%flow.length];await save();renderAll();toast('Tarefa movida para '+t.status+'.')}
async function removeTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);await save();renderAll();toast('Tarefa removida.')}
function openTask(){q('#taskModalTitle').textContent='Nova tarefa';q('#taskId').value='';q('#taskTitle').value='';q('#taskArea').value='Estudos';q('#taskStatus').value='A fazer';q('#taskPriority').value='Média';q('#taskDate').value=today();q('#taskTime').value='19:30';q('#taskDuration').value=60;q('#taskRepeat').value='none';q('#taskNotes').value='';openModal('taskModal')}
function editTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;q('#taskModalTitle').textContent='Editar tarefa';q('#taskId').value=t.id;q('#taskTitle').value=t.title;q('#taskArea').value=t.area;q('#taskStatus').value=t.status;q('#taskPriority').value=t.priority;q('#taskDate').value=t.date||today();q('#taskTime').value=t.time||'';q('#taskDuration').value=t.duration||60;q('#taskRepeat').value=t.repeat||'none';q('#taskNotes').value=t.notes||'';openModal('taskModal')}
async function saveTask(e){e.preventDefault();const id=q('#taskId').value||uid(),repeat=q('#taskRepeat').value,item={id:id,title:q('#taskTitle').value.trim(),area:q('#taskArea').value,status:q('#taskStatus').value,priority:q('#taskPriority').value,date:q('#taskDate').value,time:q('#taskTime').value,duration:Number(q('#taskDuration').value||60),notes:q('#taskNotes').value,repeat:repeat};const idx=state.tasks.findIndex(x=>x.id===id);if(idx>=0)state.tasks[idx]=item;else state.tasks.push(item);if(idx<0&&repeat!=='none'){const base=new Date(item.date+'T12:00:00');for(let n=1;n<=8;n++){const d=new Date(base);if(repeat==='weekdays'){let count=0;while(count<n){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)count++}}else d.setDate(d.getDate()+7*n);const iso=d.toISOString().slice(0,10);if(!state.tasks.some(x=>x.title===item.title&&x.date===iso))state.tasks.push({...item,id:uid(),date:iso})}}await save();closeModal('taskModal');renderAll();toast(repeat==='none'?'Tarefa salva.':'Tarefa recorrente criada.')}
function renderSchedule(){
 const base=new Date();base.setDate(base.getDate()-base.getDay());const names=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];let cal='';
 for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);const id=d.toISOString().slice(0,10),ev=state.tasks.filter(x=>x.date===id).sort((a,b)=>(a.time||'').localeCompare(b.time||''));let items='';ev.forEach(t=>{let cls=t.area==='Academia'?'gym':t.area==='Trabalho'?'work':t.area==='Finanças'?'fin':t.area==='Estudos'?'study':'';items+='<div class="event '+cls+'" data-id="'+t.id+'" onclick="editTask(this.dataset.id)">'+(t.time||'')+' · '+esc(t.title)+'</div>'});cal+='<div class="day"><div class="dhead">'+names[d.getDay()]+'</div><div class="dnum">'+d.getDate()+'</div>'+(items||'<span class="muted">livre</span>')+'</div>'}
 q('#schedule').innerHTML='<div class="card"><div class="head"><div><h2>Cronograma da semana</h2><span class="muted">visualização dos compromissos</span></div><button class="btn primary" onclick="applyRoutine()">Aplicar rotina</button></div><div class="calendar">'+cal+'</div></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="head"><h2>Rotina recomendada</h2></div><div class="muted" style="line-height:2.2">08:00–17:00 trabalho<br>17:00–18:00 pausa/deslocamento<br>18:00–19:00 academia em 3 dias<br>19:30–21:30 estudo<br>21:30–21:50 organização rápida</div></div><div class="card"><div class="head"><h2>Regra</h2></div><div class="muted" style="line-height:2.2">Planeje menos e execute melhor.<br>Uma noite livre por semana.<br>Domingo: revisão financeira + planejamento.</div></div></div>'
}
async function applyRoutine(){const base=new Date();base.setDate(base.getDate()-base.getDay());for(let i=1;i<=5;i++){const d=new Date(base);d.setDate(base.getDate()+i);const id=d.toISOString().slice(0,10);if(!state.tasks.some(x=>x.date===id&&x.title==='Estudo principal'))state.tasks.push({id:uid(),title:'Estudo principal',area:'Estudos',status:'A fazer',priority:'Alta',date:id,time:'19:30',duration:120,notes:'',repeat:'none'});if([1,3,5].includes(d.getDay())&&!state.tasks.some(x=>x.date===id&&x.title==='Academia'))state.tasks.push({id:uid(),title:'Academia',area:'Academia',status:'A fazer',priority:'Média',date:id,time:'18:00',duration:60,notes:'',repeat:'none'})}const s=new Date(base);s.setDate(base.getDate()+7);const sid=s.toISOString().slice(0,10);if(!state.tasks.some(x=>x.date===sid&&x.title==='Revisão financeira semanal'))state.tasks.push({id:uid(),title:'Revisão financeira semanal',area:'Finanças',status:'A fazer',priority:'Média',date:sid,time:'19:00',duration:30,notes:'',repeat:'none'});await save();renderAll();toast('Rotina aplicada.')}

function openGoal(){q('#goalForm').reset();openModal('goalModal')}

function openBill(){q('#billForm').reset();q('#billDue').value=today();openModal('billModal')}

async function toggleBill(id){const b=state.bills.find(x=>x.id===id);if(!b)return;b.paid=!b.paid;await save();renderAll()}
async function deleteBill(id){state.bills=state.bills.filter(x=>x.id!==id);await save();renderAll();toast('Conta removida.')}
function renderFinance(){
 const s=stats(),cats={Casa:0,Alimentação:0,Transporte:0,Estudos:0,Academia:0,Lazer:0,Investimentos:0,Outros:0};state.finances.filter(x=>x.type==='Despesa').forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.value));const max=Math.max(1,...Object.values(cats)),openBills=state.bills.filter(x=>!x.paid).reduce((a,x)=>a+Number(x.value),0);let budgets='';
 Object.entries(cats).forEach(function(p){const b=Number(state.budgets[p[0]]||0),v=p[1],pct=b?Math.min(100,Math.round(v/b*100)):Math.min(100,v/max*100);budgets+='<div style="margin:9px 0"><div class="barRow"><span>'+p[0]+'</span><div class="bar"><i style="width:'+pct+'%"></i></div><b>'+(b?money(v)+' / '+money(b):money(v))+'</b></div></div>'});
 let goals='';if(!state.goals.length)goals='<div class="muted">Cadastre uma meta financeira.</div>';else state.goals.forEach(function(g){const pct=Number(g.target)?Math.min(100,Math.round(Number(g.current)/Number(g.target)*100)):0;goals+='<div class="goalItem"><div class="goalTop"><b>'+esc(g.name)+'</b><span>'+money(g.current)+' / '+money(g.target)+'</span></div><div class="bar" style="margin-top:7px"><i style="width:'+pct+'%"></i></div><div class="goalPct">'+pct+'%'+(g.deadline?' · prazo '+g.deadline:'')+' <button class="btn small danger" data-id="'+g.id+'" onclick="deleteGoal(this.dataset.id)">Excluir</button></div></div>'});
 let bills='';if(!state.bills.length)bills='<div class="muted">Nenhuma conta cadastrada.</div>';else state.bills.slice().sort((a,b)=>String(a.due).localeCompare(String(b.due))).forEach(function(b){bills+='<div class="tableRow" style="grid-template-columns:2fr 1fr 1fr 1fr .9fr"><div><b>'+esc(b.desc)+'</b></div><div>'+esc(b.installment||'à vista')+'</div><div>'+b.due+'</div><div class="'+(b.paid?'pos':'neg')+'">'+money(b.value)+'</div><div><button class="btn small" data-id="'+b.id+'" onclick="toggleBill(this.dataset.id)">'+(b.paid?'Pago':'Pagar')+'</button><button class="btn small danger" data-id="'+b.id+'" onclick="deleteBill(this.dataset.id)">×</button></div></div>'});
 let moves='';if(!state.finances.length)moves='<div class="muted">Nenhuma movimentação cadastrada.</div>';else{moves='<div class="tableHead"><div>Descrição</div><div>Categoria</div><div>Data</div><div>Tipo</div><div>Valor</div></div>';state.finances.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(function(x){moves+='<div class="tableRow"><div><b>'+esc(x.desc)+'</b></div><div>'+esc(x.category)+'</div><div>'+x.date+'</div><div><span class="pill '+(x.type==='Receita'?'green':'redP')+'">'+x.type+'</span></div><div class="'+(x.type==='Receita'?'pos':'neg')+'">'+(x.type==='Receita'?'+':'−')+' '+money(x.value)+' <button class="btn small danger" data-id="'+x.id+'" onclick="deleteFinance(this.dataset.id)">×</button></div></div>'})}
 q('#finance').innerHTML='<div class="grid stats"><div class="card"><div class="label">Receitas</div><div class="big pos">'+money(s.income)+'</div></div><div class="card"><div class="label">Despesas</div><div class="big neg">'+money(s.expense)+'</div></div><div class="card"><div class="label">Saldo</div><div class="big">'+money(s.balance)+'</div><div class="sub">'+(s.income?Math.round(s.balance/s.income*100):0)+'% de poupança</div></div><div class="card"><div class="label">Contas em aberto</div><div class="big">'+money(openBills)+'</div></div></div>'+
 '<div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="openFinance()">＋ Movimento</button><button class="btn" onclick="openBudget()">Orçamento mensal</button><button class="btn" onclick="openGoal()">Meta financeira</button><button class="btn" onclick="openBill()">＋ Conta</button></div>'+
 '<div class="grid two" style="margin-top:14px"><div class="card"><div class="head"><h2>Orçamento por categoria</h2></div>'+budgets+'</div><div class="card"><div class="head"><h2>Metas financeiras</h2><button class="btn small" onclick="openGoal()">＋</button></div>'+goals+'</div></div>'+
 '<div class="card" style="margin-top:14px"><div class="head"><h2>Contas e parcelamentos</h2></div>'+bills+'</div><div class="card" style="margin-top:14px"><div class="head"><h2>Movimentações</h2><span class="muted">'+state.finances.length+' registros</span></div>'+moves+'</div>'

function openInvestment(){q('#invForm').reset();openModal('invModal')}

function renderInvestments(){
 const total=state.investments.reduce((a,x)=>a+Number(x.value),0),ret=state.investments.reduce((a,x)=>a+Number(x.value)*(Number(x.return||0)/100),0);let rows='';
 if(!state.investments.length)rows='<div class="muted">Cadastre seus ativos para acompanhar o patrimônio.</div>';else{rows='<div class="tableHead"><div>Ativo</div><div>Tipo</div><div>Valor</div><div>Rentabilidade</div><div></div></div>';state.investments.forEach(function(x,i){rows+='<div class="tableRow"><div><b>'+esc(x.name)+'</b></div><div>'+esc(x.type)+'</div><div>'+money(x.value)+'</div><div class="'+(Number(x.return||0)>=0?'pos':'neg')+'">'+Number(x.return||0).toFixed(2)+'%</div><div><button class="btn small danger" data-index="'+i+'" onclick="deleteInvestment(Number(this.dataset.index))">Excluir</button></div></div>'})}
 q('#investments').innerHTML='<div class="grid stats"><div class="card"><div class="label">Patrimônio</div><div class="big">'+money(total)+'</div></div><div class="card"><div class="label">Ativos</div><div class="big">'+state.investments.length+'</div></div><div class="card"><div class="label">Retorno informado</div><div class="big '+(ret>=0?'pos':'neg')+'">'+money(ret)+'</div></div><div class="card"><div class="label">Conexão</div><div class="big" style="font-size:14px">Manual</div><div class="sub">sem corretora</div></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="openInvestment()">＋ Adicionar ativo</button></div><div class="card" style="margin-top:14px"><div class="head"><h2>Carteira</h2></div>'+rows+'</div>'

function askDeleteStudy(id){
 q('#confirmTitle').textContent='Apagar registro de estudo?';
 q('#confirmMessage').textContent='Esse registro será removido da sua trilha e as horas serão recalculadas. Essa ação não pode ser desfeita.';
 q('#confirmOk').textContent='Excluir registro';

function renderRoadmap(){
 const phases=[['01','Fundamentos + Software',['Lógica e algoritmos','JavaScript + TypeScript','Python','Git + GitHub','SQL + PostgreSQL']],['02','Backend + APIs',['Node.js / FastAPI','REST + autenticação','Docker','Testes','Projeto real publicado']],['03','Cloud + DevOps',['Linux','AWS ou Azure','CI/CD','Terraform','Monitoramento']],['04','IA + Segurança',['APIs de IA','RAG e agentes','Application Security','Cloud Security','Projeto final']]];
 const now=new Date(),ws=new Date(now);ws.setDate(now.getDate()-((now.getDay()+6)%7));ws.setHours(0,0,0,0),hours=state.studySessions.filter(function(x){const d=new Date(x.date+'T12:00:00');return d>=ws&&d<=now}).reduce((a,x)=>a+Number(x.hours),0),target=Number(state.settings.studyHours||2)*5;let recent='';
 if(!state.studySessions.length)recent='<div class="muted">Registre seus estudos para acompanhar evolução.</div>';else state.studySessions.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,7).forEach(function(x){recent+='<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:10px"><div><b>'+esc(x.topic)+'</b><div class="muted">'+x.date+' · '+Number(x.hours).toFixed(1)+'h</div></div><button class="btn small danger" data-id="'+x.id+'" onclick="askDeleteStudy(this.dataset.id)" title="Apagar registro de estudo">Excluir</button></div>'});
 let cards='';phases.forEach(function(p){cards+='<div class="card phase"><span class="pill blue">'+p[0]+'</span><h3>'+p[1]+'</h3><ul>';p[2].forEach(function(item){cards+='<li>'+item+'</li>'});cards+='</ul><span class="pill purple">foco</span></div>'});
 q('#roadmap').innerHTML='<div class="grid two"><div class="card"><div class="head"><div><h2>Trilha principal</h2><span class="muted">Software → Backend → Cloud → IA + Segurança</span></div><span class="pill purple">12 meses</span></div><div class="bar"><i style="width:'+(target?Math.min(100,hours/target*100):0)+'%"></i></div><div class="muted" style="margin-top:8px">'+hours.toFixed(1)+'h nesta semana · meta '+target+'h</div><button class="btn primary" style="margin-top:12px" onclick="openStudy()">＋ Registrar estudo</button></div><div class="card"><div class="head"><h2>Histórico recente</h2></div>'+recent+'</div></div><div class="grid phaseGrid" style="margin-top:14px">'+cards+'</div>'
}
function navigate(view){qa('.nav').forEach(function(n){n.classList.toggle('active',n.dataset.view===view)});qa('.view').forEach(function(v){v.classList.toggle('active',v.id===view)});const titles={dashboard:'Visão geral',tasks:'Tarefas',schedule:'Cronograma',finance:'Finanças',investments:'Investimentos',roadmap:'Trilha TI'};const hints={dashboard:'Seu centro pessoal de planejamento.',tasks:'Organize, priorize e mova suas tarefas.',schedule:'Veja sua semana sem perder o contexto.',finance:'Controle receitas, gastos, contas e metas.',investments:'Acompanhe seu patrimônio de forma simples.',roadmap:'Registre sua evolução e mantenha o foco.'};q('#pageTitle').textContent=titles[view]||'WILKER Planner';q('#pageHint').textContent=hints[view]||''}
function renderAll(){q('#dateText').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});const status=q('.quickStat');const hint=q('#pageHint');if(hostedMode){if(status)status.innerHTML='<i class="quickDot"></i>Online · dados neste navegador';if(hint&&q('#pageTitle').textContent==='Visão geral')hint.textContent='Seu centro pessoal de planejamento, hospedado no GitHub Pages.'}else{if(status)status.innerHTML='<i class="quickDot"></i>Local · salvo automaticamente'}try{state=normalize(state);renderDashboard();renderTasks();renderSchedule();renderFinance();renderInvestments();renderRoadmap()}catch(err){console.error('WILKER render error',err);q('#dashboard').innerHTML='<div class="card"><div class="head"><h2>Seu Planner está carregando</h2></div><div class="muted">Atualize a página para sincronizar os dados deste navegador.</div></div>';}}

qa('.nav').forEach(function(n){n.onclick=function(){navigate(n.dataset.view)}});
q('#newTaskBtn').onclick=openTask;q('#routineBtn').onclick=applyRoutine;
q('#taskForm').onsubmit=saveTask;q('#finForm').onsubmit=saveFinance;q('#invForm').onsubmit=saveInvestment;q('#budgetForm').onsubmit=saveBudget;q('#goalForm').onsubmit=saveGoal;q('#billForm').onsubmit=saveBill;q('#studyForm').onsubmit=saveStudy;
qa('[data-close]').forEach(function(b){b.onclick=function(){closeModal(b.dataset.close)}});
q('#backupBtn').onclick=function(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='wilker-planner-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exportado.')};
q('#restoreInput').onchange=async function(e){const f=e.target.files[0];if(!f)return;try{state=normalize(JSON.parse(await f.text()));await save();renderAll();toast('Backup restaurado.')}catch{toast('Backup inválido.')}e.target.value=''};
load();
