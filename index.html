<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WILKER Planner</title>
<style>
:root{
 --bg:#f4f7fb;--panel:#fff;--text:#182235;--muted:#758196;--line:#e7ebf2;
 --blue:#2868ee;--blueSoft:#edf4ff;--green:#0aa477;--greenSoft:#e9faf4;
 --orange:#d08a00;--orangeSoft:#fff6e4;--red:#d94242;--redSoft:#ffeded;
 --purple:#7a50df;--purpleSoft:#f2edff;--shadow:0 10px 28px rgba(20,36,65,.065)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}.sidebar{width:244px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 27px}.brandMark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#855be8);display:grid;place-items:center;color:white;font-weight:800;font-size:19px}.brand strong{display:block;font-size:15px}.brand small{display:block;color:#8d97a8;font-size:9px;letter-spacing:2px;margin-top:2px}
.nav{display:block;width:100%;border:0;background:transparent;color:#66728a;text-align:left;padding:11px 12px;border-radius:9px;margin:3px 0;font-weight:650}.nav:hover,.nav.active{background:var(--blueSoft);color:var(--blue)}
.sideBottom{margin-top:auto}.local{border:1px solid var(--line);border-radius:11px;padding:10px;font-size:11px;color:#647188;line-height:1.55}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.sideBtn{display:block;width:100%;border:1px solid var(--line);background:#fff;color:#5d6b81;border-radius:8px;padding:9px;margin-top:8px;text-align:center;font-weight:600}.sideBtn input{display:none}
.main{flex:1;min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.topbar h1{margin:0;font-size:23px}.eyebrow{font-size:11px;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:1px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:#5f6d83;padding:9px 12px;border-radius:8px;font-weight:650}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}.btn.small{padding:6px 8px;font-size:11px}
.view{display:none;padding:26px 30px 55px}.view.active{display:block}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.head h2{font-size:15px;margin:0}.muted{font-size:11px;color:var(--muted)}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.big{font-size:27px;font-weight:800;margin-top:7px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.twocol{grid-template-columns:1.35fr .85fr;margin-top:14px}
.rows{display:grid;gap:8px}.taskRow{border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:grid;grid-template-columns:20px 1fr auto auto;gap:9px;align-items:center}.taskName{font-size:12px;font-weight:750}.meta{font-size:10px;color:var(--muted);margin-top:3px}.check{width:18px;height:18px;border:1px solid #ccd5e2;background:#fff;border-radius:5px;color:white}.check.done{background:var(--green);border-color:var(--green)}
.pill{display:inline-flex;align-items:center;border-radius:99px;font-size:9px;font-weight:800;padding:5px 8px}.pill.blue{background:var(--blueSoft);color:var(--blue)}.pill.green{background:var(--greenSoft);color:#078663}.pill.orange{background:var(--orangeSoft);color:var(--orange)}.pill.red{background:var(--redSoft);color:var(--red)}.pill.purple{background:var(--purpleSoft);color:var(--purple)}
.bars{display:grid;gap:13px}.barRow{display:grid;grid-template-columns:86px 1fr 34px;gap:9px;align-items:center;font-size:11px}.bar{height:9px;background:#eef2f7;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2868ee,#855be8);border-radius:99px}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lane{background:#eef2f7;border-radius:12px;padding:10px;min-height:420px}.laneTitle{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;color:#5e6b80;margin:4px 4px 10px}.kcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;margin:7px 0;box-shadow:0 4px 14px rgba(20,35,60,.04)}.kTitle{font-size:12px;font-weight:750}.kMeta{font-size:10px;color:var(--muted);margin-top:5px}.kActions{display:flex;gap:5px;margin-top:9px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);background:#fff;border-radius:12px;overflow:hidden}.day{min-height:135px;padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day:nth-child(7n){border-right:0}.dhead{font-size:10px;color:var(--muted);font-weight:750}.dnum{font-size:14px;font-weight:800;margin:4px 0 8px}.event{font-size:9px;font-weight:700;padding:5px 6px;border-radius:6px;background:var(--blueSoft);color:var(--blue);margin:4px 0;cursor:pointer}.event.gym{background:var(--greenSoft);color:#078663}.event.work{background:var(--orangeSoft);color:#a86c00}.event.fin{background:var(--redSoft);color:#c63838}.event.study{background:var(--purpleSoft);color:var(--purple)}
.tableHead,.tableRow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;align-items:center}.tableHead{font-size:9px;text-transform:uppercase;color:var(--muted);padding:8px 11px}.tableRow{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:11px;margin:5px 0}.money{font-weight:800}.pos{color:#08986e}.neg{color:#d53d3d}
.chartGrid{display:grid;grid-template-columns:1.3fr .9fr;gap:14px;margin-top:14px}.monthBars{display:flex;align-items:flex-end;gap:11px;height:190px;padding:10px 4px 0}.monthBar{flex:1;display:grid;gap:6px;justify-items:center;height:100%;align-items:end}.monthBar i{display:block;width:100%;max-width:34px;background:linear-gradient(180deg,#855be8,#2868ee);border-radius:8px 8px 2px 2px}.monthBar span{font-size:9px;color:var(--muted)}
.roadmap{grid-template-columns:repeat(4,1fr)}.phase h3{font-size:14px;margin:10px 0 3px}.phase ul{font-size:11px;color:#58647a;line-height:1.9;padding-left:17px}.tag{display:inline-block;font-size:9px;font-weight:800;background:var(--blueSoft);color:var(--blue);padding:4px 6px;border-radius:5px}
.goal{display:flex;align-items:center;gap:10px}.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) 72%,#e8edf5 0);position:relative}.ring:after{content:"";width:40px;height:40px;background:#fff;border-radius:50%;position:absolute}.ring b{position:relative;z-index:1;font-size:10px}
.modal{position:fixed;inset:0;background:rgba(16,26,47,.5);z-index:30;display:grid;place-items:center;padding:20px}.hidden{display:none}.modalBox{width:min(650px,100%);background:#fff;border-radius:15px;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.22)}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead h2{font-size:18px;margin:0}.close{background:none;border:0;color:#778296;font-size:26px}.formGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.modal label{display:grid;gap:5px;margin:10px 0;font-size:10px;color:#66738a;font-weight:750}.modal input,.modal select,.modal textarea{border:1px solid #dce3ec;border-radius:8px;padding:9px;outline:none}.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#7ea8ff;box-shadow:0 0 0 3px #edf4ff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;right:22px;bottom:22px;background:#182235;color:white;border-radius:9px;padding:11px 14px;font-size:11px;opacity:0;transform:translateY(6px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.sidebar{width:76px}.brand div:not(.brandMark),.nav span,.sideBottom{display:none}.nav{text-align:center}.stats{grid-template-columns:repeat(2,1fr)}.twocol,.chartGrid,.roadmap{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:1fr}}
@media(max-width:680px){.sidebar{display:none}.topbar{padding:0 16px}.view{padding:18px 15px 40px}.stats,.twocol,.chartGrid,.roadmap{grid-template-columns:1fr}.calendar{grid-template-columns:1fr}.day{min-height:86px}.formGrid{grid-template-columns:1fr}.topbar .btn{padding:8px}.tableHead,.tableRow{grid-template-columns:1.7fr 1fr 1fr}.tableHead div:nth-child(n+4),.tableRow>div:nth-child(n+4){display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandMark">W</div><div><strong>WILKER</strong><small>PLANNER</small></div></div>
 <nav>
  <button class="nav active" data-view="dashboard">◈ <span>Visão geral</span></button>
  <button class="nav" data-view="tasks">☷ <span>Tarefas</span></button>
  <button class="nav" data-view="schedule">◷ <span>Cronograma</span></button>
  <button class="nav" data-view="finance">R$ <span>Finanças</span></button>
  <button class="nav" data-view="investments">◆ <span>Investimentos</span></button>
  <button class="nav" data-view="roadmap">↗ <span>Trilha TI</span></button>
 </nav>
 <div class="sideBottom">
  <div class="local"><span class="dot"></span><b>Dados locais</b><br>Salvos neste PC</div>
  <button id="backup" class="sideBtn">↓ Exportar backup</button>
  <label class="sideBtn">↑ Importar backup<input id="restore" type="file" accept=".json"></label>
 </div>
</aside>
<main class="main">
 <header class="topbar"><div><div id="date" class="eyebrow"></div><h1 id="pageTitle">Visão geral</h1></div><div class="toolbar"><button class="btn" id="routineBtn">Rotina</button><button class="btn primary" id="newTaskBtn">＋ Nova tarefa</button></div></header>
 <section id="dashboard" class="view active"></section><section id="tasks" class="view"></section><section id="schedule" class="view"></section><section id="finance" class="view"></section><section id="investments" class="view"></section><section id="roadmap" class="view"></section>
</main>
</div>
<div id="taskModal" class="modal hidden"><div class="modalBox"><div class="modalHead"><h2 id="taskModalTitle">Nova tarefa</h2><button class="close" id="taskClose">×</button></div>
<form id="taskForm"><input type="hidden" id="taskId"><label>Tarefa<input id="taskTitle" required placeholder="Ex.: Estudar TypeScript"></label><div class="formGrid">
<label>Área<select id="taskArea"><option>Estudos</option><option>Trabalho</option><option>Academia</option><option>Finanças</option><option>Pessoal</option></select></label>
<label>Status<select id="taskStatus"><option>A fazer</option><option>Em andamento</option><option>Concluída</option></select></label>
<label>Prioridade<select id="taskPriority"><option>Alta</option><option>Média</option><option>Baixa</option></select></label>
<label>Data<input id="taskDate" type="date" required></label><label>Horário<input id="taskTime" type="time"></label><label>Duração (min)<input id="taskDuration" type="number" min="15" step="15" value="60"></label></div>
<label>Observações<textarea id="taskNotes" rows="3"></textarea></label><div class="actions"><button type="button" class="btn" id="taskCancel">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>
<div id="finModal" class="modal hidden"><div class="modalBox"><div class="modalHead"><h2>Nova movimentação</h2><button class="close" id="finClose">×</button></div>
<form id="finForm"><label>Descrição<input id="finDesc" required placeholder="Salário, mercado, internet..."></label><div class="formGrid">
<label>Tipo<select id="finType"><option>Receita</option><option>Despesa</option></select></label><label>Categoria<select id="finCat"><option>Salário</option><option>Casa</option><option>Alimentação</option><option>Transporte</option><option>Estudos</option><option>Academia</option><option>Lazer</option><option>Investimentos</option><option>Outros</option></select></label>
<label>Valor<input id="finValue" required type="number" step="0.01" min="0"></label><label>Data<input id="finDate" required type="date"></label></div><div class="actions"><button type="button" class="btn" id="finCancel">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>
<div id="toast" class="toast"></div>
<script>
const APP_KEY="wilker-planner-state-v2";let state={tasks:[],finances:[],investments:[],settings:{studyHours:2}},apiReady=false;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],todayISO=()=>new Date().toISOString().slice(0,10),money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const done=t=>t.status==="Concluída";
function toast(msg){const x=$("#toast");x.textContent=msg;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
function localSave(){localStorage.setItem(APP_KEY,JSON.stringify(state))}
async function loadState(){try{const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw new Error();state=await r.json();apiReady=true;localSave()}catch{const s=localStorage.getItem(APP_KEY);if(s)state=JSON.parse(s);apiReady=false}if(!state.tasks?.length)seed();renderAll()}
async function saveState(){localSave();if(!apiReady)return;try{await fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(state)})}catch{apiReady=false;toast("Servidor indisponível; backup local mantido.")}}
function seed(){const d=todayISO();state.tasks=[{id:uid(),title:"Trabalho / expediente",area:"Trabalho",status:"A fazer",priority:"Alta",date:d,time:"08:00",duration:480,notes:"Bloco principal do dia."},{id:uid(),title:"Academia",area:"Academia",status:"A fazer",priority:"Média",date:d,time:"18:00",duration:60,notes:"Treino."},{id:uid(),title:"Estudo principal",area:"Estudos",status:"A fazer",priority:"Alta",date:d,time:"19:30",duration:120,notes:"Bloco de foco."},{id:uid(),title:"Revisão financeira",area:"Finanças",status:"A fazer",priority:"Média",date:d,time:"21:30",duration:20,notes:"Conferir gastos e saldo."}];state.finances=[];state.investments=[];localSave()}
function stats(){const income=state.finances.filter(x=>x.type==="Receita").reduce((a,x)=>a+Number(x.value),0),expense=state.finances.filter(x=>x.type==="Despesa").reduce((a,x)=>a+Number(x.value),0),invested=state.investments.reduce((a,x)=>a+Number(x.value),0);return{income,expense,balance:income-expense,invested}}
function renderAll(){$("#date").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});renderDashboard();renderTasks();renderSchedule();renderFinance();renderInvestments();renderRoadmap()}
function renderDashboard(){const s=stats(),total=state.tasks.length,finished=state.tasks.filter(done).length,today=state.tasks.filter(x=>x.date===todayISO()).sort((a,b)=>(a.time||"").localeCompare(b.time||"")),areas={Estudos:0,Trabalho:0,Academia:0,Finanças:0,Pessoal:0};state.tasks.forEach(x=>areas[x.area]=(areas[x.area]||0)+1);const mx=Math.max(1,...Object.values(areas));$("#dashboard").innerHTML=`
<div class="grid stats"><div class="card"><div class="label">Tarefas concluídas</div><div class="big">${finished}/${total}</div><div class="sub">${total?Math.round(finished/total*100):0}% do planejado</div></div><div class="card"><div class="label">Saldo registrado</div><div class="big">${money(s.balance)}</div><div class="sub">receitas − despesas</div></div><div class="card"><div class="label">Patrimônio informado</div><div class="big">${money(s.invested)}</div><div class="sub">investimentos manuais</div></div><div class="card"><div class="label">Meta de estudo</div><div class="big">${state.settings.studyHours}h/dia</div><div class="sub">bloco de foco</div></div></div>
<div class="grid twocol"><div class="card"><div class="head"><div><h2>Hoje</h2><span class="muted">${today.length} compromisso(s)</span></div><button class="btn small" onclick="openTask()">＋</button></div><div class="rows">${today.length?today.map(taskRow).join(""):'<div class="muted">Nenhuma tarefa para hoje.</div>'}</div></div>
<div class="card"><div class="head"><h2>Distribuição da rotina</h2></div><div class="bars">${Object.entries(areas).map(([k,v])=>`<div class="barRow"><span>${k}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><b>${v}</b></div>`).join("")}</div></div></div>
<div class="grid twocol"><div class="card"><div class="head"><div><h2>Meta da semana</h2><span class="muted">trabalho + estudo + saúde</span></div><span class="pill purple">2h/dia</span></div><div class="goal"><div class="ring"><b>72%</b></div><div><b>Trilha TI em andamento</b><div class="muted" style="margin-top:4px">Software → Backend → Cloud → IA + Segurança</div></div></div></div>
<div class="card"><div class="head"><h2>Resumo rápido</h2></div><div class="muted" style="line-height:2">✓ estudar 5 dias<br>✓ academia 3 dias<br>✓ revisar finanças 1x/semana<br>✓ manter uma noite livre</div></div></div>`}
function taskRow(t){return`<div class="taskRow"><button class="check ${done(t)?"done":""}" onclick="toggleTask('${t.id}')">${done(t)?"✓":""}</button><div><div class="taskName">${esc(t.title)}</div><div class="meta">${t.time||"--"} · ${t.duration||0} min · ${t.area}</div></div><span class="pill ${t.priority==="Alta"?"red":t.priority==="Média"?"orange":"blue"}">${t.priority}</span><button class="btn small" onclick="openTask('${t.id}')">✎</button></div>`}
function taskCard(t){return`<div class="kcard"><div class="kTitle">${esc(t.title)}</div><div class="kMeta">${t.date||"sem data"} · ${t.time||"--"} · ${t.area}</div><div class="kActions"><span class="pill ${t.priority==="Alta"?"red":t.priority==="Média"?"orange":"blue"}">${t.priority}</span><button class="btn small" onclick="openTask('${t.id}')">Editar</button><button class="btn small danger" onclick="removeTask('${t.id}')">Excluir</button></div></div>`}
function renderTasks(){const groups={"A fazer":state.tasks.filter(x=>x.status==="A fazer"),"Em andamento":state.tasks.filter(x=>x.status==="Em andamento"),"Concluída":state.tasks.filter(done)};$("#tasks").innerHTML=`<div class="toolbar"><button class="btn primary" onclick="openTask()">＋ Nova tarefa</button><button class="btn" onclick="applyRoutine()">Aplicar rotina da semana</button></div><div class="kanban">${Object.entries(groups).map(([name,list])=>`<div class="lane"><div class="laneTitle"><span>${name}</span><span>${list.length}</span></div>${list.length?list.map(taskCard).join(""):'<div class="muted" style="padding:8px">Nenhuma tarefa.</div>'}</div>`).join("")}</div>`}
async function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.status=done(t)?"A fazer":"Concluída";await saveState();renderAll()}
async function removeTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);await saveState();renderAll();toast("Tarefa removida.")}
function openTask(id){const t=state.tasks.find(x=>x.id===id)||{id:"",title:"",area:"Estudos",status:"A fazer",priority:"Média",date:todayISO(),time:"19:30",duration:60,notes:""};$("#taskModalTitle").textContent=id?"Editar tarefa":"Nova tarefa";$("#taskId").value=t.id;$("#taskTitle").value=t.title;$("#taskArea").value=t.area;$("#taskStatus").value=t.status;$("#taskPriority").value=t.priority;$("#taskDate").value=t.date;$("#taskTime").value=t.time;$("#taskDuration").value=t.duration;$("#taskNotes").value=t.notes;$("#taskModal").classList.remove("hidden")}
async function submitTask(e){e.preventDefault();const id=$("#taskId").value||uid(),item={id,title:$("#taskTitle").value,area:$("#taskArea").value,status:$("#taskStatus").value,priority:$("#taskPriority").value,date:$("#taskDate").value,time:$("#taskTime").value,duration:Number($("#taskDuration").value),notes:$("#taskNotes").value},i=state.tasks.findIndex(x=>x.id===id);if(i>=0)state.tasks[i]=item;else state.tasks.push(item);await saveState();$("#taskModal").classList.add("hidden");e.target.reset();renderAll();toast("Tarefa salva.")}
function renderSchedule(){const start=new Date();start.setDate(start.getDate()-start.getDay());const names=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];let html=`<div class="card"><div class="head"><div><h2>Cronograma da semana</h2><span class="muted">Trabalho + academia + estudo + revisão financeira</span></div><button class="btn primary" onclick="applyRoutine()">Aplicar rotina</button></div><div class="calendar">`;for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const id=d.toISOString().slice(0,10),ev=state.tasks.filter(x=>x.date===id).sort((a,b)=>(a.time||"").localeCompare(b.time||""));html+=`<div class="day"><div class="dhead">${names[d.getDay()]}</div><div class="dnum">${d.getDate()}</div>${ev.map(t=>`<div class="event ${t.area==="Academia"?"gym":t.area==="Trabalho"?"work":t.area==="Finanças"?"fin":t.area==="Estudos"?"study":""}" onclick="openTask('${t.id}')">${t.time||""} · ${esc(t.title)}</div>`).join("")||'<span class="muted">livre</span>'}</div>`}html+="</div></div><div class="grid twocol"><div class="card"><h2 style="font-size:15px">Rotina base</h2><div class="muted" style="line-height:2.2;margin-top:10px">08:00–17:00 trabalho<br>17:00–18:00 pausa/deslocamento<br>18:00–19:00 academia (3x/semana)<br>19:30–21:30 estudo<br>21:30–21:50 organização rápida</div></div><div class="card"><h2 style="font-size:15px">Regra de sustentabilidade</h2><div class="muted" style="line-height:2.2;margin-top:10px">2 horas focadas são melhores que jornadas exaustivas.<br>Manter uma noite livre.<br>Domingo: revisão financeira + planejamento.</div></div></div>";$("#schedule").innerHTML=html}
async function applyRoutine(){const base=new Date();base.setDate(base.getDate()-base.getDay());for(let i=1;i<=5;i++){const d=new Date(base);d.setDate(base.getDate()+i);const id=d.toISOString().slice(0,10);if(!state.tasks.some(x=>x.date===id&&x.title==="Estudo principal"))state.tasks.push({id:uid(),title:"Estudo principal",area:"Estudos",status:"A fazer",priority:"Alta",date:id,time:"19:30",duration:120,notes:"Bloco de foco."});if([1,3,5].includes(d.getDay())&&!state.tasks.some(x=>x.date===id&&x.title==="Academia"))state.tasks.push({id:uid(),title:"Academia",area:"Academia",status:"A fazer",priority:"Média",date:id,time:"18:00",duration:60,notes:"Treino."})}const s=new Date(base);s.setDate(base.getDate()+7);const sid=s.toISOString().slice(0,10);if(!state.tasks.some(x=>x.date===sid&&x.title==="Revisão financeira semanal"))state.tasks.push({id:uid(),title:"Revisão financeira semanal",area:"Finanças",status:"A fazer",priority:"Média",date:sid,time:"19:00",duration:30,notes:"Saldo, despesas e investimentos."});await saveState();renderAll();toast("Rotina aplicada.")}
function renderFinance(){const s=stats(),cats={Casa:0,Alimentação:0,Transporte:0,Estudos:0,Academia:0,Lazer:0,Investimentos:0,Outros:0};state.finances.filter(x=>x.type==="Despesa").forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.value));const max=Math.max(1,...Object.values(cats)),months={};state.finances.forEach(x=>{const m=x.date?.slice(0,7)||"sem";months[m]=(months[m]||0)+(x.type==="Receita"?Number(x.value):-Number(x.value))});const bars=Object.entries(months).slice(-8).map(([m,v])=>`<div class="monthBar"><i style="height:${Math.max(10,Math.min(90,Math.abs(v)/Math.max(1,s.income)*90))}%"></i><span>${m.slice(5)}/${m.slice(2,4)}</span></div>`).join("");$("#finance").innerHTML=`<div class="grid stats"><div class="card"><div class="label">Receitas</div><div class="big pos">${money(s.income)}</div></div><div class="card"><div class="label">Despesas</div><div class="big neg">${money(s.expense)}</div></div><div class="card"><div class="label">Saldo</div><div class="big">${money(s.balance)}</div></div><div class="card"><div class="label">Taxa de poupança</div><div class="big">${s.income?Math.round(s.balance/s.income*100):0}%</div></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="openFin()">＋ Nova movimentação</button></div><div class="grid chartGrid"><div class="card"><div class="head"><h2>Resultado por período</h2><span class="muted">últimos registros</span></div><div class="monthBars">${bars||'<div class="muted">Adicione movimentações para visualizar.</div>'}</div></div><div class="card"><div class="head"><h2>Gastos por categoria</h2></div>${Object.entries(cats).map(([k,v])=>`<div class="barRow"><span>${k}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b>${money(v).replace("R$","")}</b></div>`).join("")}</div></div><div class="card" style="margin-top:14px"><div class="head"><h2>Movimentações</h2><span class="muted">${state.finances.length} registros</span></div>${state.finances.length?'<div class="tableHead"><div>Descrição</div><div>Categoria</div><div>Data</div><div>Tipo</div><div>Valor</div></div>'+state.finances.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="tableRow"><div><b>${esc(x.desc)}</b></div><div>${esc(x.category)}</div><div>${x.date}</div><div><span class="pill ${x.type==="Receita"?"green":"red"}">${x.type}</span></div><div class="money ${x.type==="Receita"?"pos":"neg"}">${x.type==="Receita"?"+":"−"} ${money(x.value)}</div></div>`).join(""):'<div class="muted">Nenhuma movimentação cadastrada.</div>'}</div>`}
function openFin(){$("#finDate").value=todayISO();$("#finModal").classList.remove("hidden")}
async function submitFin(e){e.preventDefault();state.finances.push({id:uid(),desc:$("#finDesc").value,type:$("#finType").value,category:$("#finCat").value,value:Number($("#finValue").value),date:$("#finDate").value});await saveState();e.target.reset();$("#finModal").classList.add("hidden");renderAll();toast("Movimentação salva.")}
function renderInvestments(){const total=state.investments.reduce((a,x)=>a+Number(x.value),0);$("#investments").innerHTML=`<div class="grid stats"><div class="card"><div class="label">Patrimônio informado</div><div class="big">${money(total)}</div><div class="sub">controle manual</div></div><div class="card"><div class="label">Quantidade de ativos</div><div class="big">${state.investments.length}</div></div><div class="card"><div class="label">Aporte do mês</div><div class="big">—</div><div class="sub">próxima fase</div></div><div class="card"><div class="label">Conexão externa</div><div class="big" style="font-size:14px">Desativada</div><div class="sub">sem corretora</div></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="addInvestment()">＋ Adicionar ativo</button></div><div class="card"><div class="head"><h2>Carteira</h2><span class="muted">valores informados por você</span></div>${state.investments.length?'<div class="tableHead"><div>Ativo</div><div>Tipo</div><div>Valor</div><div>Rentabilidade</div><div></div></div>'+state.investments.map((x,i)=>`<div class="tableRow"><div><b>${esc(x.name)}</b></div><div>${esc(x.type)}</div><div class="money">${money(x.value)}</div><div class="${x.return>=0?"pos":"neg"}">${x.return||0}%</div><div><button class="btn small danger" onclick="deleteInvestment(${i})">Excluir</button></div></div>`).join(""):'<div class="muted">Cadastre seus ativos para acompanhar o patrimônio.</div>'}</div>`}
async function addInvestment(){const name=prompt("Nome do ativo:");if(!name)return;const type=prompt("Tipo do ativo:","Renda fixa")||"Outro",value=Number(prompt("Valor atual:","0")||0),ret=Number(prompt("Rentabilidade (%):","0")||0);state.investments.push({id:uid(),name,type,value,return:ret});await saveState();renderAll();toast("Ativo adicionado.")}
async function deleteInvestment(i){state.investments.splice(i,1);await saveState();renderAll()}
function renderRoadmap(){const phases=[["01","Fundamentos + Software",["Lógica e algoritmos","JavaScript + TypeScript","Python","Git + GitHub","SQL + PostgreSQL"]],["02","Backend + APIs",["Node.js / FastAPI","REST + autenticação","Docker","Testes","Projeto real publicado"]],["03","Cloud + DevOps",["Linux","AWS ou Azure","CI/CD","Terraform","Monitoramento"]],["04","IA + Segurança",["APIs de IA","RAG e agentes","Application Security","Cloud Security","Projeto final"]]];$("#roadmap").innerHTML=`<div class="grid twocol" style="margin-top:0"><div class="card"><div class="head"><div><h2>Trilha principal</h2><span class="muted">Software → Backend → Cloud → IA + Segurança</span></div><span class="pill purple">12 meses</span></div><div class="bar"><i style="width:8%"></i></div><div class="muted" style="margin-top:8px">A base vem primeiro. As especializações entram depois.</div></div><div class="card"><div class="head"><h2>Meta semanal</h2><span class="pill blue">foco</span></div><div class="muted" style="line-height:2.1">5 blocos de estudo<br>3 treinos<br>1 revisão financeira<br>1 período livre</div></div></div><div class="grid roadmap" style="margin-top:14px">${phases.map(p=>`<div class="card phase"><span class="pill blue">${p[0]}</span><h3>${p[1]}</h3><ul>${p[2].map(i=>`<li>${i}</li>`).join("")}</ul><span class="tag">foco</span></div>`).join("")}</div>`}
function initNav(){const titles={dashboard:"Visão geral",tasks:"Tarefas",schedule:"Cronograma",finance:"Finanças",investments:"Investimentos",roadmap:"Trilha TI"};$$(".nav").forEach(b=>b.onclick=()=>{$$(".nav").forEach(n=>n.classList.remove("active"));b.classList.add("active");$$(".view").forEach(v=>v.classList.remove("active"));$("#"+b.dataset.view).classList.add("active");$("#pageTitle").textContent=titles[b.dataset.view]})}
$("#newTaskBtn").onclick=()=>openTask();$("#routineBtn").onclick=applyRoutine;$("#taskForm").onsubmit=submitTask;$("#finForm").onsubmit=submitFin;$("#taskClose").onclick=$("#taskCancel").onclick=()=>$("#taskModal").classList.add("hidden");$("#finClose").onclick=$("#finCancel").onclick=()=>$("#finModal").classList.add("hidden");
$("#backup").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="wilker-planner-backup.json";a.click();URL.revokeObjectURL(a.href);toast("Backup exportado.")};
$("#restore").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state=JSON.parse(await f.text());await saveState();renderAll();toast("Backup restaurado.")}catch{toast("Backup inválido.")}};
initNav();loadState();
</script>
</body>
</html>
